[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "repo-decisions"
version = "0.1.0"
description = "Codex ADR decision layer plugin POC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["adr", "codex", "mcp", "repository-decisions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
repo-decisions = "repo_decisions.cli:main"

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6",
  "mypy>=1.18",
  "pytest>=8",
  "ruff>=0.15",
]

[tool.coverage.run]
branch = true
source = ["repo_decisions"]
omit = [
  "repo_decisions/__main__.py",
  "plugins/repo-decisions/repo_decisions/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["repo_decisions"]
