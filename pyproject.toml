[project]
name = "repo-decisions"
version = "0.1.0"
description = "Codex ADR decision layer plugin POC"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6",
  "mypy>=1.18",
  "pytest>=8",
  "ruff>=0.15",
]

[tool.coverage.run]
branch = true
source = ["repo_decisions"]
omit = [
  "repo_decisions/__main__.py",
  "plugins/repo-decisions/repo_decisions/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
