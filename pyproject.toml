[project]
name = "memorycore"
version = "0.1.0"
description = "Research prototype for Decision-First Agent Memory."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
experiments = ["hydra-core>=1.3", "optuna>=3.6", "pandas>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
