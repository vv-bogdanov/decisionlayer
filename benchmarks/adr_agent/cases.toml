[[cases]]
id = "format-preservation-add-adr"
fixture = "format_preservation"
task = """
Add an accepted ADR for this repository.

Decision to record: all outbound HTTP clients must use a 5 second timeout.
Preserve the repository's existing ADR directory, numbering, status style,
headings, and filename convention. Use the repo-decisions tool if available.
"""
required_globs = ["docs/adr/0002-*.md"]
required_patterns = [
  "docs/adr/0002-*.md::## Status\\s+Accepted",
  "docs/adr/0002-*.md::## Context and Problem Statement",
  "docs/adr/0002-*.md::5 second timeout",
  "docs/adr/0002-*.md::## Decision",
]
forbidden_patterns = []
verify_commands = []
requires_debug_write = true

[[cases]]
id = "code-follows-jsonl-adr"
fixture = "code_follows_adr"
task = """
Implement append_event in src/persistence.py and make the unit tests pass.
Follow the accepted ADRs in this repository.
"""
required_globs = ["src/persistence.py"]
required_patterns = [
  "src/persistence.py::json\\.dumps",
  "src/persistence.py::write\\(",
]
forbidden_patterns = [
  "src/persistence.py::import csv",
  "src/persistence.py::csv\\.",
]
verify_commands = ["python3 -m unittest discover -s tests -v"]
requires_debug_write = false

[[cases]]
id = "supersede-accepted-adr"
fixture = "supersede_accepted"
task = """
Change the accepted persistence decision from SQLite to PostgreSQL.
Do not directly edit the accepted ADR body. Use the repository's supersede flow
so the old ADR is marked superseded and the new accepted ADR records the
replacement decision.
"""
required_globs = ["docs/adr/0002-*.md"]
required_patterns = [
  "docs/adr/0001-use-sqlite.md::Superseded by ADR-0002",
  "docs/adr/0002-*.md::Supersedes: \\[ADR-0001",
  "docs/adr/0002-*.md::PostgreSQL",
  "docs/adr/0002-*.md::## Decision",
]
forbidden_patterns = [
  "docs/adr/0001-use-sqlite.md::Use PostgreSQL as the primary persistence store",
]
verify_commands = []
requires_debug_write = true

[[cases]]
id = "conflict-requires-supersede-confirmation"
fixture = "conflict_detection"
task = """
Implement the requested switch from SQLite to PostgreSQL immediately, without
changing or superseding any ADRs.
"""
required_globs = []
required_patterns = []
forbidden_patterns = []
required_stdout_patterns = ["(?i)(conflict|contradict).*(ADR|decision)", "(?i)(supersede|confirmation|confirm)"]
forbidden_stdout_patterns = []
verify_commands = []
requires_debug_write = false
forbid_adr_changes = true
forbid_changes = true

[[cases]]
id = "no-false-decision-creation"
fixture = "no_false_decision"
task = """
Summarize the notes in docs/notes.md. They contain brainstorming text that
looks decision-like, but the user has not explicitly authorized creating an
accepted ADR.
"""
required_globs = []
required_patterns = []
forbidden_patterns = []
required_stdout_patterns = [
  "(?i)(no|none|nothing|not|won.t|will not|unapproved|not approved|not authorized).*(accepted ADR|ADR|decision|finalized architectural decision|binding decision|create|add)",
]
forbidden_stdout_patterns = []
verify_commands = []
requires_debug_write = false
forbid_adr_changes = true
