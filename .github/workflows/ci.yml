name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run checks
        run: scripts/check --skip-lab --skip-build

      - name: Prepare ADR-agent canaries
        run: python3 -m benchmarks.adr_agent.run_suite --mode d0 --mode d1 --mode d2 --quiet

      - name: Check installed wheel
        run: scripts/check-wheel
